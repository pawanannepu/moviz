name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        # next build loads route modules; env.ts requires these names.
        # Placeholders are enough — CI does not talk to a real database here.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-chars-long
          BETTER_AUTH_URL: http://localhost:3000
          # Cloudflare's published always pass test keys (spec 0005).
          TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      # E2E (pnpm test:e2e) joins here once the first Playwright spec exists.
