name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        # next build loads route modules; env.ts requires DATABASE_URL.
        # A placeholder is enough — CI does not talk to a real database here.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      # E2E (pnpm test:e2e) joins here once the first Playwright spec exists.
